[project]
name = "langchain-k8s"
version = "0.1.0"
description = "Kubernetes Agent Sandbox integration for LangChain Deep Agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Ueslei Lima" }]
keywords = ["langchain", "langgraph", "kubernetes", "sandbox", "agent", "deepagents", "k8s", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "deepagents>=0.4.0",
    "k8s-agent-sandbox>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/uesleilima/langchain-k8s"
Repository = "https://github.com/uesleilima/langchain-k8s"
Issues = "https://github.com/uesleilima/langchain-k8s/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_k8s"]

[dependency-groups]
dev = [
    "pytest>=7.3.0,<9.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a Kind cluster (deselect with '-m \"not integration\"')",
]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "agentic_sandbox.*"
ignore_missing_imports = true
