name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-k8s
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Upload assets & create deployment
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"

      - name: Create GitHub deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/deployments \
            -f ref="${{ github.event.release.tag_name }}" \
            -f environment="pypi" \
            -f description="Published langchain-k8s ${{ github.event.release.tag_name }} to PyPI" \
            -F auto_merge=false \
            -f required_contexts='[]' \
            --jq '.id' | while read -r DEPLOY_ID; do
              gh api repos/${{ github.repository }}/deployments/${DEPLOY_ID}/statuses \
                -f state="success" \
                -f environment_url="https://pypi.org/project/langchain-k8s/${{ github.event.release.tag_name }}/" \
                -f description="Deployed to PyPI"
            done
