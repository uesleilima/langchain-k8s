<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#326CE5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A3A7A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD43B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Kubernetes helm wheel (simplified) -->
  <g transform="translate(256,240)" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Center hub -->
    <circle cx="0" cy="0" r="32" fill="#fff" fill-opacity="0.15" stroke="#fff" stroke-width="6"/>
    <circle cx="0" cy="0" r="14" fill="#fff" fill-opacity="0.3"/>

    <!-- 7 spokes radiating out -->
    <line x1="0" y1="-36" x2="0" y2="-100"/>
    <line x1="34" y1="-17" x2="87" y2="-50"/>
    <line x1="34" y1="17" x2="87" y2="50"/>
    <line x1="0" y1="36" x2="0" y2="100"/>
    <line x1="-34" y1="17" x2="-87" y2="50"/>
    <line x1="-34" y1="-17" x2="-87" y2="-50"/>

    <!-- Outer spoke tips (pods) -->
    <circle cx="0" cy="-110" r="16" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-width="5"/>
    <circle cx="95" cy="-55" r="16" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-width="5"/>
    <circle cx="95" cy="55" r="16" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-width="5"/>
    <circle cx="0" cy="110" r="16" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-width="5"/>
    <circle cx="-95" cy="55" r="16" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-width="5"/>
    <circle cx="-95" cy="-55" r="16" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-width="5"/>

    <!-- Outer ring connecting the tips -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="12 8" opacity="0.4"/>
  </g>

  <!-- Chain links (LangChain) overlaid on lower-right -->
  <g transform="translate(340,340) rotate(-45)" stroke="url(#chainGrad)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Link 1 -->
    <rect x="-18" y="-50" width="36" height="54" rx="18" ry="18"/>
    <!-- Link 2 (interlocked) -->
    <rect x="-18" y="-10" width="36" height="54" rx="18" ry="18"/>
  </g>

  <!-- Small sparkle / AI dot accent -->
  <circle cx="380" cy="300" r="6" fill="#FFD43B" opacity="0.9"/>
  <circle cx="395" cy="285" r="3" fill="#FFD43B" opacity="0.6"/>
</svg>
