# Sandbox router — Deployment and Service.
# Routes requests to sandbox pods via X-Sandbox-ID header.
#
# The Service name and namespace are both load-bearing: the SDK's connector
# hardcodes `svc/sandbox-router-svc` as its port-forward target, and since
# agent-sandbox v0.5.0 the NetworkPolicy generated by the SandboxTemplate
# controller only admits router ingress from `agent-sandbox-system`.
#
# Image note: the router is published to the k8s staging registry only —
# neither `sandbox-router` nor its Go successor `sandbox-router-go` has any
# tag on registry.k8s.io.  The tag below is pinned deliberately; a floating
# `latest-main` plus `imagePullPolicy: IfNotPresent` means one machine can
# silently run a months-old cached layer while CI runs today's.  Staging
# tags do get garbage-collected, so if the pull fails, list current tags:
#
#   gcloud artifacts docker tags list \
#     us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router
#
# Migrating to `sandbox-router-go` is the path if we ever need the Pod-IP
# cache, scoped-token authz or WebSocket proxying; it also needs a
# ServiceAccount plus RBAC, which this minimal dev manifest deliberately
# avoids (see `automountServiceAccountToken: false` below).
#
# ── Authentication ───────────────────────────────────────────────────
# This manifest is secure-by-default and sets no auth env vars, so applying
# it on its own leaves the router refusing to start with:
#
#   RuntimeError: ROUTER_AUTH_TOKEN must be set to start the sandbox router
#   securely. If you intentionally need unauthenticated mode for local
#   development or testing, set ALLOW_UNAUTHENTICATED_ROUTER=true explicitly.
#
# That is deliberate (agent-sandbox v0.5.0 hardening, kubernetes-sigs#755):
# an unconfigured router would otherwise be an open proxy to every sandbox
# pod.  Pick one before deploying anywhere shared:
#
#   1. Bearer token — create a Secret and reference it here:
#
#        kubectl create secret generic sandbox-router-auth \
#          -n agent-sandbox-system --from-literal=token="$(openssl rand -hex 32)"
#
#        env:
#          - name: ROUTER_AUTH_TOKEN
#            valueFrom:
#              secretKeyRef: {name: sandbox-router-auth, key: token}
#
#      Note the Python SDK cannot send this token — no connection config
#      carries one and the connector sets no Authorization header — so a
#      token-protected router is reachable only by clients that can.
#
#   2. Unauthenticated, local only — the `k8s/dev-kind` kustomize overlay adds
#      ALLOW_UNAUTHENTICATED_ROUTER=true, and `scripts/kind-setup.sh` applies
#      that overlay rather than this file directly.  The setting lives there
#      rather than here precisely so it cannot be copy-pasted into a shared
#      cluster along with this YAML.
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-svc
  namespace: agent-sandbox-system
spec:
  type: ClusterIP
  selector:
    app: sandbox-router
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
    spec:
      automountServiceAccountToken: false
      containers:
        - name: router
          image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router:v20260806-v0.5.4-10-g76ec022
          imagePullPolicy: IfNotPresent
          # No auth env vars here by design — see "Authentication" at the top
          # of this file.  The router will not start until either
          # ROUTER_AUTH_TOKEN or ALLOW_UNAUTHENTICATED_ROUTER is supplied.
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
