# Sandbox router — Deployment and Service.
# Routes requests to sandbox pods via X-Sandbox-ID header.
#
# The Service name and namespace are both load-bearing: the SDK's connector
# hardcodes `svc/sandbox-router-svc` as its port-forward target, and since
# agent-sandbox v0.5.0 the NetworkPolicy generated by the SandboxTemplate
# controller only admits router ingress from `agent-sandbox-system`.
#
# Image note: the router is published to the k8s staging registry only —
# neither `sandbox-router` nor its Go successor `sandbox-router-go` has any
# tag on registry.k8s.io.  The tag below is pinned deliberately; a floating
# `latest-main` plus `imagePullPolicy: IfNotPresent` means one machine can
# silently run a months-old cached layer while CI runs today's.  Staging
# tags do get garbage-collected, so if the pull fails, list current tags:
#
#   gcloud artifacts docker tags list \
#     us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router
#
# Migrating to `sandbox-router-go` is the path if we ever need the Pod-IP
# cache, scoped-token authz or WebSocket proxying; it also needs a
# ServiceAccount plus RBAC, which this minimal dev manifest deliberately
# avoids (see `automountServiceAccountToken: false` below).
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-svc
  namespace: agent-sandbox-system
spec:
  type: ClusterIP
  selector:
    app: sandbox-router
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
    spec:
      automountServiceAccountToken: false
      containers:
        - name: router
          image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router:v20260806-v0.5.4-10-g76ec022
          imagePullPolicy: IfNotPresent
          env:
            # Since agent-sandbox v0.5.0 the router refuses to start without
            # either ROUTER_AUTH_TOKEN or this explicit opt-out (the proxy was
            # previously reachable unauthenticated — kubernetes-sigs#755).
            #
            # We opt out rather than set a token because the Python SDK has no
            # way to send one: no connection config carries an auth token and
            # the connector never sets an Authorization header.  Bearer auth
            # would therefore make the router unreachable from this client.
            #
            # Acceptable here and ONLY here: this is a single-node Kind cluster
            # reached over `kubectl port-forward`, so the proxy is not exposed
            # beyond the developer's own machine.  Do NOT copy this into a
            # shared or production cluster — use the Gateway connection mode,
            # or the Go router with `--authz-mode=scoped-token`, instead.
            - name: ALLOW_UNAUTHENTICATED_ROUTER
              value: "true"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
