# SonarCloud configuration for langchain-k8s
sonar.projectKey=uesleilima_langchain-k8s
sonar.organization=uesleilima

# Only analyse production source code
sonar.sources=src/

# Mark test directories
sonar.tests=tests/

# Exclude test files from security hotspot and issue analysis
sonar.exclusions=tests/**

# Python version
sonar.python.version=3.11
